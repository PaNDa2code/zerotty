when:
  - event: pull_request
  - event: push
    branch: master

steps:
  - name: build and run tests
    image: debian:bookworm-slim

    commands:
      - apt-get update
      - apt-get install -y --no-install-recommends sudo curl bash xz-utils git ca-certificates bison glslang-tools zstd zip python3

      - curl -sSf https://raw.githubusercontent.com/MingFei2001/install-zig/refs/heads/main/install-zig.sh | bash

      - zig build
      - zig build test

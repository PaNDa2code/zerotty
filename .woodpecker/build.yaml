when:
  - event: pull_request
  - event: push
    branch: master

steps:
  - name: build and run tests
    image: alpine:latest

    commands:
      - apk add --no-cache sudo curl bash xz minisign git ca-certificates bison glslang zstd zip python3 vulkan-loader mesa-vulkan-swrast vulkan-tools

      - ci/install-zig.sh

      - zig build
      - zig build test

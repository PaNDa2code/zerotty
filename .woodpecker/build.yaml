
steps:
  - name: check build and run tests
    image: debian:bookworm-slim
    when:
      - event: push
        branch: master

    commands:
      - apt-get update
      - apt-get install -y --no-install-recommends sudo curl bash xz-utils git ca-certificates bison glslang-tools zstd zip python3

      - curl -sSf https://raw.githubusercontent.com/MingFei2001/install-zig/refs/heads/main/install-zig.sh | bash

      - zig build
      - zig build test

  - name: build release
    image: debian:bookworm-slim
    when:
      - event: tag

    commands:
      - apt-get update
      - apt-get install -y --no-install-recommends sudo curl bash xz-utils git ca-certificates bison glslang-tools zstd zip python3

      - curl -sSf https://raw.githubusercontent.com/MingFei2001/install-zig/refs/heads/main/install-zig.sh | bash

      - zig build release -Darchive -Drelease_mode=Debug
      - zig build release -Darchive -Duse_llvm -Drelease_mode=ReleaseFast

      - ls -R zig-out

  - name: publish release
    image: woodpeckerci/plugin-release
    when:
      - event: tag
    settings:
      api_key:
        from_secret: ACCESS_TOKEN
      base_url: https://codeberg.org
      files:
        - zig-out/release/zerotty-x86_64-linux-Debug.tar.gz
        - zig-out/release/zerotty-x86_64-windows-Debug.zip
        - zig-out/release/zerotty-x86_64-linux-ReleaseFast.tar.gz
        - zig-out/release/zerotty-x86_64-windows-ReleaseFast.zip

      checksum: sha256
      title: ${CI_COMMIT_TAG}

when:
  - event: pull_request
  - event: push
    branch: master

steps:
  - name: build and run tests
    image: debian:bookworm-slim

    commands:
      - apt-get update
      - |
        apt-get install -y --no-install-recommends \
          sudo \
          curl \
          bash \
          xz-utils \
          git \
          ca-certificates \
          bison \
          glslang-tools \
          zstd \
          zip \
          libvulkan1 \
          mesa-vulkan-drivers \
          vulkan-tools \
          python3

      - ci/install-zig.sh

      - zig build
      - zig build test

steps:
  - name: build release
    image: alpine:latest
    when:
      - event: tag

    commands:
      - apk add --no-cache sudo curl bash xz git ca-certificates bison minisign glslang zstd zip python3

      - ./ci/install-zig.sh

      - >-
        zig build release
        --release=safe
        -Darchive
        -Drelease_targets=x86_64-linux-gnu,x86_64-windows-gnu,aarch64-linux-gnu,aarch64-windows-gnu

      - ls -R zig-out


  - name: publish release
    image: woodpeckerci/plugin-release
    when:
      - event: tag
    settings:
      prerelease: true
      api_key:
        from_secret: ACCESS_TOKEN
      base_url: https://codeberg.org
      files:
        - zig-out/release/zerotty-*.tar.gz
        - zig-out/release/zerotty-*.zip

      checksum: sha256
      checksum-flatten: true
      title: ${CI_COMMIT_TAG}

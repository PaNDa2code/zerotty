steps:
  - name: build release
    image: debian:bookworm-slim
    when:
      - event: tag

    commands:
      - apt-get update
      - |
        apt-get install -y --no-install-recommends \
          sudo \
          curl \
          bash \
          xz-utils \
          git \
          ca-certificates \
          bison \
          glslang-tools \
          zstd \
          zip \
          python3

      - ./ci/install-zig.sh

      - |
        zig build release \
          -Darchive \
          -Drelease_mode=debug \
          -Drelease_targets=$RELEASE_TARGETS

      - |
        zig build release \
          -Darchive \
          -Duse_llvm \
          -Drelease_mode=$RELEASE_MODE \
          -Drelease_targets=$RELEASE_TARGETS

      - ls -R zig-out

    environment:
      RELEASE_MODE: fast
      RELEASE_TARGETS: x86_64-linux,x86_64-windows,aarch64-linux,aarch64-windows


  - name: publish release
    image: woodpeckerci/plugin-release
    when:
      - event: tag
    settings:
      prerelease: true
      api_key:
        from_secret: ACCESS_TOKEN
      base_url: https://codeberg.org
      files:
        - zig-out/release/zerotty-*.tar.gz
        - zig-out/release/zerotty-*.zip

      checksum: sha256
      checksum-flatten: true
      title: ${CI_COMMIT_TAG}
